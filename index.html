<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Digital Circuit Simulator</title>
    <style>
        :root { font-family: "Segoe UI", "Helvetica Neue", "Noto Sans", Arial, sans-serif; color: #1f2328; }
        * { box-sizing: border-box; }
        body { margin: 0; background: #ffffff; }
        main { max-width: 1200px; margin: auto; padding: 20px 16px; }
        h1 { margin: 0 0 4px; font-size: 22px; }
        h2 { margin: 16px 0 8px; font-size: 15px; }
        section h2:first-child { margin-top: 0; }
        p { margin: 0 0 16px; color: #5f6770; font-size: 14px; }
        label { display: block; margin-bottom: 4px; color: #5f6770; font-size: 13px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .card { background: #ffffff; border: 1px solid #d8dbdf; border-radius: 4px; padding: 16px; min-width: 0; }
        textarea, input { width: 100%; background: #ffffff; color: #1f2328; border: 1px solid #b9bec5;
            border-radius: 3px; padding: 6px 8px; font: 13px Consolas, Menlo, "DejaVu Sans Mono", monospace; }
        textarea { min-height: 210px; resize: vertical; }
        input { margin-bottom: 10px; }
        textarea:focus, input:focus { outline: 2px solid #1d5fbf; outline-offset: -1px; }
        button { margin: 4px 4px 4px 0; padding: 7px 12px; color: #ffffff; background: #1d5fbf; border: 0;
            border-radius: 3px; font: inherit; font-size: 13px; cursor: pointer; }
        button:hover { background: #174c99; }
        button:focus-visible { outline: 2px solid #1f2328; outline-offset: 1px; }
        button[data-operation="simulate"] { background: #1b7f3b; }
        button[data-operation="simulate"]:hover { background: #15652f; }
        button[data-operation="validate"] { background: #0b7285; }
        button[data-operation="validate"]:hover { background: #085b6a; }
        pre { margin: 0; padding: 8px; white-space: pre-wrap; overflow: auto; min-height: 100px;
            background: #f3f4f6; border: 1px solid #d8dbdf; border-radius: 3px;
            font: 13px Consolas, Menlo, "DejaVu Sans Mono", monospace; }
        @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<main>
    <h1>Digital Circuit Simulator</h1>
    <p>Browser client backed by the TeaVM-generated JavaScript engine.</p>
    <div class="grid">
        <section class="card">
            <h2>Primary netlist</h2>
            <textarea id="netlist">SIM_TIME 10
WIRE A
WIRE B
WIRE OUT
AND gate 0 A B OUT
STIMULUS 0 A 1
STIMULUS 0 B 1</textarea>
            <label>Inputs (comma-separated)</label>
            <input id="inputs" value="A,B">
            <label>Outputs (comma-separated)</label>
            <input id="outputs" value="OUT">
            <button data-operation="simulate">Simulate</button>
            <button data-operation="validate">Validate</button>
            <button data-operation="analyze">Analyze timing</button>
            <button data-operation="truth-table">Truth table</button>
        </section>
        <section class="card">
            <h2>Equivalence comparison</h2>
            <textarea id="comparison">SIM_TIME 10
WIRE A
WIRE B
WIRE OUT
OR gate 0 A B OUT</textarea>
            <button data-operation="equivalent">Check equivalence</button>
            <h2>Result</h2>
            <pre id="result">Build the project with Maven, then select an operation.</pre>
        </section>
    </div>
</main>
<script src="target/generated/js/simulator.js"></script>
<script>
    const result = document.getElementById("result");
    const value = id => document.getElementById(id).value;
    const show = text => {
        try { result.textContent = JSON.stringify(JSON.parse(text), null, 2); }
        catch (_) { result.textContent = text; }
    };
    const names = () => [value("inputs"), value("outputs")];

    document.querySelectorAll("button[data-operation]").forEach(button => {
        button.addEventListener("click", () => {
            try {
                if (typeof runSimulation !== "function") {
                    throw new Error("TeaVM engine is not loaded. Run mvn package first.");
                }
                const operation = button.dataset.operation;
                const [inputs, outputs] = names();
                let response;
                if (operation === "simulate") response = runSimulation(value("netlist"));
                if (operation === "validate") response = validateCircuit(value("netlist"));
                if (operation === "analyze") response = analyzeCircuit(value("netlist"));
                if (operation === "truth-table") {
                    response = generateTruthTable(value("netlist"), inputs, outputs);
                }
                if (operation === "equivalent") {
                    response = checkEquivalent(value("netlist"), value("comparison"),
                        inputs, outputs);
                }
                show(response);
            } catch (error) {
                show(JSON.stringify({ success: false, error: error.message }));
            }
        });
    });
</script>
</body>
</html>
